# Builds and pushes container images to GitHub Container Registry when a
# version tag (v1.2.3) is pushed:
#
#   ghcr.io/johnlholloway/nas-lights          linux/amd64, linux/arm64
#   ghcr.io/johnlholloway/nas-lights-openrgb  linux/amd64 (the OpenRGB AppImage is x86_64 only)
#
# Tags: 1.2.3, 1.2 and latest.
name: Images

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ghcr.io/johnlholloway/nas-lights
            context: .
            platforms: linux/amd64,linux/arm64
          - image: ghcr.io/johnlholloway/nas-lights-openrgb
            context: ./openrgb
            platforms: linux/amd64
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-qemu-action@v3
        if: contains(matrix.platforms, 'arm64')

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          flavor: |
            latest=auto

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: ${{ matrix.platforms }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
